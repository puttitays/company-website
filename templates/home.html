<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}


{% block content %}
<p>The current date and time is: {% now "DATETIME_FORMAT" %}</p>

<ul>
{% for item in inventory_list %}
<li>{{ item }}</li>
{% endfor %}
</ul>
<p>{{ greeting| title }}</p>
</body>

{% endblock %}
</html>
