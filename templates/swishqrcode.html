
{% extends "base.html"%}
{% load static %}
{% block content %}
<p style="text-align:center;" >Scan QR code here to make a payment</p>


<div style="margin: 0 auto; width: fit-content;">
    <p style="margin: 0 auto; width: fit-content;" id="qrcode" ></p><br>
    <p style ="display:inline"> or click this link</p>

    <a id="linkswish" style="color:Violet">Swish</a>





</div>






<script src="quote.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
    const paymentsummary="swish://payment?token=1234567890&amount=1500&message=Puthyamyong"
new QRCode(document.getElementById("qrcode"),{
text:paymentsummary

});

        document.getElementById("linkswish").href=paymentsummary

</script>



<script>
    const swish=document.getElementById("Swish").value
    document.getElementById("Swish").addEventListener("click",function(){
    document.getElementById("finalmethod").innerHTML=`Place order with : ${swish}`;

});
    const paypal=document.getElementById("Paypal").value
    document.getElementById("Paypal").addEventListener("click",function(){
    document.getElementById("finalmethod").innerHTML=`Place order with : ${paypal}`
});
    const Credit_card=document.getElementById("Credit_card").value
    document.getElementById("Credit_card").addEventListener("click",function(){
    document.getElementById("finalmethod").innerHTML=`Place order with : ${Credit_card}`
});

    document.getElementById("finalmethod").addEventListener("click",function(){
    if (this.textContent==="Place order with : Swish"){
     window.location.href="{% url 'swishqrcode' %}";


    }else {

     window.location.href="window.html";

    }



    })


</script>




{% endblock %}
